name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag Version (e.g. 1.2.3). Leave empty to auto-determine based on conventional commits.
        required: false
        default: ''

jobs:
  tag-changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ssh-key: ${{ secrets.SSH_KEY }}
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Create Release Tag
      uses: egose/actions/release-tag@7a010fcf15d592c751df049c071db109b3e4e6eb
      with:
        tag: ${{ github.event.inputs.tag }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-merge-pr: 'true'
        delete-merged-branch: 'true'
        sign-commit: 'true'
        gpg-private-key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        gpg-passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        git-user-email: ${{ secrets.RELEASE_USER_EMAIL }}
